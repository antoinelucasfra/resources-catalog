# CI checks for the catalog: lint the data on every push/PR. PR renders and
# deploys are owned by publish.yml (its build job already gates pull_request),
# so CI adds only the data-quality gate. Keep it fast.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        working-directory: scripts
        run: uv sync --locked

      - name: Lint resources.txt
        working-directory: scripts
        run: uv run python lint.py

      # Fails when resources.txt is not in normalized shape: duplicate URLs,
      # tracking parameters, legacy types or malformed facets.
      - name: Check resources.txt is normalized
        working-directory: scripts
        run: uv run python normalize.py --check

      # The catalog page is rendered by this file at runtime; a syntax error
      # would otherwise only surface as a blank catalog after deploy.
      - name: Check catalog renderer syntax
        run: node --check assets/js/catalog.js

