# Catalog CI: render on pull requests, publish the catalog site on pushes to main.
# R packages come from CRAN via Posit Package Manager binaries; the R surface is
# small (parser + YAML writer), so there is no renv lockfile to restore.

name: Catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::quarto
            any::rmarkdown
            any::here
            any::yaml
            any::tibble
            any::dplyr
            any::rlang

      # Runner images are mid-migration (Quarto present in some snapshots,
      # absent in others), and the official quarto-actions setup still apt-
      # installs pinned versions, which trips the downgrade guard. Install a
      # pinned .deb with dpkg instead: deterministic, checksum-verified, and
      # dpkg has no downgrade guard. `quarto-required` in _quarto.yml gates the
      # version floor as a backstop.
      - name: Install Quarto
        run: |
          wget -q https://github.com/quarto-dev/quarto-cli/releases/download/v1.9.37/quarto-1.9.37-linux-amd64.deb
          echo "98aad03c8ce11705caa7c48b8f6ea59f6ab02d1579e754ddb530c0f2e7b471c6  quarto-1.9.37-linux-amd64.deb" | sha256sum -c -
          sudo dpkg --force-downgrade -i quarto-1.9.37-linux-amd64.deb
          quarto --version

      - name: Render catalog
        run: quarto render

      - name: Verify render output
        run: |
          test -f docs/index.html
          test ! -f docs/CONTRIBUTING.html
          grep -q 'Resources Catalog' docs/index.html

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
