# Monthly liveness check of every resource URL in resources.txt.
# Report-only for the catalog data: this workflow never fails, never
# auto-removes entries and never edits resources.txt. Retiring a dead link is a
# manual decision made via scripts/retire.py. The one file it publishes is the
# liveness snapshot the site reads (scripts/reports/link-health.json), opened as
# a PR so a human still reviews it before the catalog starts showing banners.

name: Link health

on:
  schedule:
    - cron: "0 5 2 * *" # 2nd of the month, 05:00 UTC (off-peak)
  workflow_dispatch:

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  link-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        working-directory: scripts
        run: uv sync --locked

      - name: Check all resource URLs
        working-directory: scripts
        run: RESOURCES_PATH=../resources.txt uv run python link_health.py --output ../link-health-report.md --json reports/link-health.json

      - name: Open data refresh PR
        uses: peter-evans/create-pull-request@v7
        with:
          title: "chore: refresh link-health data"
          commit-message: "chore: refresh link-health data"
          branch: chore/link-health-data
          add-paths: scripts/reports/link-health.json
          body: |
            Monthly snapshot from `link_health.py --json`, consumed by
            `resources.R` to render verified / possibly dead / unverified
            link states. Merging it does not add or remove catalog entries.

      - name: Create or update sticky link health issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Link health report — $(date +%Y-%m)"
          BODY="$(cat link-health-report.md)"

          # Reuse the open sticky issue by stable title prefix, if any.
          ISSUE_NUMBER=$(gh issue list \
            --state open \
            --search "Link health report in:title" \
            --json number \
            --jq ".[].number" | head -n 1)

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
